<!DOCTYPE html>
<html lang="pt- BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    

    <title >Barbearia Brutu's</title>
</head>
<body class="container">
     <h1>Barbearia Brutu's</h1>
    <h2> Agendamento Barbearia Brut'us</h2>

    <img src="projeto-barbearia/assets/adriano-logo.png" alt="adriano-foto">

    <form id="contatoForm">
        <input type="text" name="name" placeholder="Nome do Cliente" class="form-control" required>
        <input type="text" name="phone" placeholder="Telefone para contato" class="form-control" required>      
        <div class="row">
            <div class="col-md-6">
                <input type="date" name="date" class="form-control" required>
            </div>
            <div class="col-md-6">
                <input type="time" name="time" class="form-control" required>
            </div>
        </div>
        <select name="service" class="form-select mb-3" required>
            <option value="" selected disabled>Selecione o serviço</option>
            <option value="Corte de Cabelo">Corte de Cabelo - R$ 35,00</option>
            <option value="Barba">Barba - R$ 20,00</option>
            <option value="Corte + Barba">Corte + Barba - R$ 50,00</option>
            <option value="Corte + Luzes">Corte + Luzes - R$ 100,00</option>
        </select>
        <button type="submit" class="btn btn-primary">Agendar Horário</button>
    </form>
     
    <h3 class="section-title">Próximos Agendamentos</h3>
    <div class="controls-wrapper">
        <select id="orderBy" class="form-select form-select-sm w-auto">
            <option value="name">Ordenar por Nome</option>
            <option value="phone">Ordenar por Telefone</option>
            <option value="time">Ordenar por Horário</option>
        </select>
        <input type="text" id="search" placeholder="Filtrar por telefone..." class="form-control form-control-sm w-auto">
    </div>

    <div class="table-container">
        <table class="table" id="agendamentsTable">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Telefone</th>
                    <th>Serviço</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>


    
    <div id="pagination" class="d-flex justify-content-center gap-1 mt-2"></div>





    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="js/script.js"></script>


</body>


</html>
